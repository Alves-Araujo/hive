name: moradia_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_maps_flutter: ^2.17.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.9.0
  image_picker: ^1.2.3
  firebase_storage: ^13.5.0
  geocoding: ^5.0.0
  http: ^1.6.0
  geolocator: 14.0.2
  google_sign_in: ^7.2.0
  flutter_polyline_points: ^3.1.0
  mask_text_input_formatter: ^2.9.0
  record: ^6.2.1
  audioplayers: ^6.6.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  palette_generator: ^0.3.3+3
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Icone do app (rode: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#1E6FE0"
  macos:
    generate: true


flutter:
  uses-material-design: true

  # Aqui está a configuração da sua logo com o espaçamento correto
  assets:
    - assets/images/logo_claro.png
    - assets/images/logo_escuro.png
    - assets/map_styles/
